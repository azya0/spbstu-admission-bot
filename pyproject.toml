[project]
name = "tg-bot"
version = "1.0.0"
description = "App to check you position in spbstu master_pre_competition_lists"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.30.0",
    "aiohttp>=3.14.3",
    "async-lru>=2.3.0",
    "futile-di-azya0>=0.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.5",
    "redis>=8.1.0",
]

[tool.ruff.lint]
ignore = ["B008"]
