services:
  redis:
    image: redis:latest
    container_name: spbstu-bot-redis
    ports:
        - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
        - redis-data:/data
    environment:
        - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis

volumes:
    redis-data:
        driver: local
